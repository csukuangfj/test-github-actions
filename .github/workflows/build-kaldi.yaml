name: build-kaldi

on:
  push:
    branches:
      - kaldi-docker-2
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx is required by build-push-action for cache + correct builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr requires lowercase image names, so normalize the owner explicitly.
      - name: Compute image name and tags
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          date_tag="2026-11-19"
          {
            echo "name=ghcr.io/${owner}/kaldi"
            echo "tags=ghcr.io/${owner}/kaldi:latest,ghcr.io/${owner}/kaldi:${date_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./kaldi
          file: ./kaldi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
