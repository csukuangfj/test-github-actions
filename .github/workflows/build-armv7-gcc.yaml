name: build-armv7-gcc11-glibc217

on:
  push:
    branches:
      - test-arm

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./gcc-armv7
          file: ./gcc-armv7/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/armv7-gcc11-glibc217:latest

