name: ubuntu

on:
  push:
    branches:
      - test-arm

  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Test
        shell: bash
        run: |
          echo "github.repository_owner: ${{ github.repository_owner }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"

      - name: Enable binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io

      - name: Build
        uses: addnab/docker-run-action@v3
        with:
            image: quay.io/pypa/manylinux2014_armv7l
            shell: bash
            run: |
              uname -a
              which gcc

              gcc --version
              g++ --version
              ldd --version
