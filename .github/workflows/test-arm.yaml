name: ubuntu

on:
  push:
    branches:
      - test-arm

  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Test
        shell: bash
        run: |
          echo "github.repository_owner: ${{ github.repository_owner }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"

      - name: Enable binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build
        uses: addnab/docker-run-action@v3
        with:
            # see https://github.com/rust-cross/manylinux-cross
            image: messense/manylinux2014-cross:armv7l-arm64
            shell: bash
            run: |
              # find / -name "*gcc*"

              uname -a
              which gcc

              ls -lh /usr/armv7-unknown-linux-gnueabihf/bin

              export PATH=/usr/armv7-unknown-linux-gnueabihf/bin:$PATH

              export CC=armv7-unknown-linux-gnueabihf-gcc
              export CXX=armv7-unknown-linux-gnueabihf-g++
              export AR=armv7-unknown-linux-gnueabihf-ar
              export RANLIB=armv7-unknown-linux-gnueabihf-ranlib

              armv7-unknown-linux-gnueabihf-gcc --version
              which armv7-unknown-linux-gnueabihf-gcc
              file $(which armv7-unknown-linux-gnueabihf-gcc)

              echo 'int main(){return 0;}' > t.c
              armv7-unknown-linux-gnueabihf-gcc t.c -o t

              file t

              strings t | grep ^GLIBC




