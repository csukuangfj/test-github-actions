name: job-container-gcc11-aarch64-224

on:
  push:
    branches:
      - gcc11-linux-2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        uses: addnab/docker-run-action@v3
        with:
            image: ghcr.io/csukuangfj/manylinux_2_24-aarch64-gcc11:latest
            shell: bash
            run: |
              set -e
              gcc --version
              g++ --version
              ldd --version
              which gcc

              # The reason this image exists: a stock gcc on a glibc 2.24 base
              # defaults to the C++11 ABI and honours -D_GLIBCXX_USE_CXX11_ABI.
              # The distro compiler here is gcc 6, far too old for onnxruntime
              # (needs >= 11.1 and C++20), so the image ships a built one.
              bash /check-cxx11-abi.sh
