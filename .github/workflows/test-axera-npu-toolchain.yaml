name: test-axera-npu-toolchain

on:
  push:
    branches:
      - axera-npu-toolchain

jobs:
  axera-npu-toolchain:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pulsar2 image
        run: |
          curl -SL -O https://huggingface.co/AXERA-TECH/Pulsar2/resolve/main/4.2/ax_pulsar2_4.2.tar.gz
          ls -lh *.tar.gz

      - name: Load Docker image
        run: |
          docker load -i ax_pulsar2_4.2.tar.gz

      - name: List images
        run: docker images


      - name: Tag image for GHCR
        run: |
          docker tag axera/pulsar2:4.2 ghcr.io/${{ github.repository_owner }}/ax-pulsar2:4.2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/ax-pulsar2:4.2

      - name: Verify push
        run: docker pull ghcr.io/${{ github.repository_owner }}/ax-pulsar2:4.2



