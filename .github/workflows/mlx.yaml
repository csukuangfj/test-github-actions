name: mlx

on:
  push:
    branches:
      - mlx

jobs:
  macos-mlx-wheel:
    if: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13]
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mlx
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ml-explore/mlx mlx-2
          mv mlx-2/* ./

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES='x86_64' -DMLX_ENABLE_X64_MAC=ON -DMLX_BUILD_METAL=ON -DMLX_BUILD_GGUF=ON -DMLX_BUILD_SAFETENSORS=ON -DCMAKE_BUILD_TYPE=Release" MACOSX_DEPLOYMENT_TARGET=10.13 CFLAGS="-mmacosx-version-min=10.13" CXXFLAGS="-mmacosx-version-min=10.13"
          CIBW_ARCHS: "x86_64"
          CIBW_BUILD_VERBOSITY: 3

          #  Don't repair macOS wheels
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl


  macos-mlx:
    name: ${{ matrix.shared }} ${{ matrix.mlx_version }}
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13]
        # python-version: ["3.7", "3.8", "3.9", "3.10"]
        python-version: ["3.10"]
        mlx_version: ["0.26.3"]
        shared: [ON, OFF]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.shared }}-${{ matrix.mlx_version }}

      - name: Download mlx
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ml-explore/mlx

      - name: Build mlx ${{ matrix.shared }}
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version

          cd mlx
          mkdir build
          cd build
          cmake \
            -D MLX_ENABLE_X64_MAC=ON \
            -D MLX_BUILD_TESTS=OFF \
            -D MLX_BUILD_EXAMPLES=OFF \
            -D MLX_BUILD_METAL=ON \
            -D MLX_BUILD_GGUF=OFF \
            -D MLX_BUILD_SAFETENSORS=OFF \
            -D BUILD_SHARED_LIBS=${{ matrix.shared }} \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_INSTALL_PREFIX=./install \
            ..

          make -j
          make install
          ls -lh install/*
          find ./install
