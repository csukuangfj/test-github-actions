name: build-gcc11-manylinux2014-aarch64

on:
  push:
    branches: [gcc-11-aarch64]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        gcc:
          - "11.4.0"
          - "12.3.0"
          - "13.2.0"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx is required for cache + multi-platform correctness
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GCC ${{ matrix.gcc }}
        uses: docker/build-push-action@v5
        with:
          context: ./gcc-aarch64
          file: ./gcc-aarch64/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            GCC_VERSION=${{ matrix.gcc }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/manylinux2014-aarch64-gcc:${{ matrix.gcc }}
            ghcr.io/${{ github.repository_owner }}/manylinux2014-aarch64-gcc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
